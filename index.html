<!DOCTYPE html>

<head>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Biblioteca oficial do Supabase (Corrigida para o link de execução correto) -->

            darkMode: 'class',

                    colors: {
                        dark: { 900: '#0a0a0a', 800: '#121212', 700: '#1e1e1e', 600: '#2a2a2a', 500: '#3a3a3a' },

                    },
                    fontFamily: { heading: ['Montserrat', 'sans-serif'], body: ['Inter', 'sans-serif'] }
                }
            }
        }

        // Inicialização e conexão real com o seu Supabase
        const SUPABASE_URL = "https://tlknobptwlzftoiqztdm.supabase.co";
        const SUPABASE_KEY = "sb_publishable_EqXL4DJmBk3tA9U6Sv0dGw_2xeaTFCJ";

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #e5e5e5; -webkit-tap-highlight-color: transparent; }
        .bg-bandeira {
            background-image: linear-gradient(rgba(10, 10, 10, 0.88), rgba(10, 10, 10, 0.88)), url('bandeira.jpg');
            background-size: contain; background-position: center; background-repeat: no-repeat; background-attachment: fixed;
        }
        h1, h2, h3, .font-heading { font-family: 'Montserrat', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff6b00; }
        input[type="date"], input[type="time"] { min-height: 42px; color-scheme: dark; }
    </style>
</head>
<body class="bg-dark-900 bg-bandeira text-gray-200 min-h-screen flex flex-col md:flex-row font-body">

    <!-- Mobile Header -->
    <div class="md:hidden bg-dark-800/95 backdrop-blur-md border-b border-dark-600 p-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-motorcycle text-amber-500 text-2xl"></i>
            <span class="font-heading font-black tracking-wider text-lg text-white">INFORMAIS <span class="text-amber-500">MG</span></span>
        </div>
        <button id="mobileMenuBtn" onclick="toggleSidebar()" class="text-gray-300 hover:text-white focus:outline-none p-2">
            <i class="fa-solid fa-bars text-2xl"></i>
        </button>
    </div>

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition duration-200 ease-in-out z-40 w-64 bg-dark-800/95 backdrop-blur-md border-r border-dark-600 flex flex-col justify-between h-screen">
        <div>
            <div class="p-6 border-b border-dark-600 flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-amber-500 to-amber-700 flex items-center justify-center text-dark-900 shadow-lg">
                    <i class="fa-solid fa-motorcycle text-xl"></i>
                </div>
                <div>
                    <h1 class="font-heading font-black text-lg tracking-wider text-white leading-none">INFORMAIS</h1>
                    <span class="text-xs text-amber-500 font-semibold tracking-widest uppercase">MOTO GRUPO</span>
                </div>
            </div>

            <!-- Identificação do Usuário + Botão de Login/Logout -->
            <div class="px-6 py-4 bg-dark-700/50 border-b border-dark-600/50 space-y-2">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <span id="pinStatusDot" class="w-2.5 h-2.5 bg-gray-500 rounded-full"></span>
                        <span id="userLoggedName" class="text-xs font-bold text-white truncate max-w-[110px]">Visitante</span>
                    </div>
                    <button type="button" onclick="fazerLoginLogout()" id="btnLoginLogout" class="text-xs bg-amber-500 hover:bg-amber-600 text-dark-900 font-bold px-3 py-1.5 rounded-lg transition">Login</button>
                </div>
                <p id="userLoggedRole" class="text-[10px] text-gray-400">Modo Leitura</p>
            </div>

            <!-- Navegação -->
            <nav class="p-4 space-y-1">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-restrito hidden nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-gray-400 hover:text-white hover:bg-dark-700/50 transition">
                    <i class="fa-solid fa-chart-pie w-5"></i><span>Dashboard</span>
                </button>
                
                <!-- Membros -->
                <button onclick="switchTab('membros')" id="nav-membros" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-gray-400 hover:text-white hover:bg-dark-700/50 transition">
                    <i class="fa-solid fa-users w-5"></i><span>Membros</span>
                </button>
                
                <!-- Abas Públicas -->
                <button onclick="switchTab('eventos')" id="nav-eventos" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-amber-500 bg-dark-700 transition">
                    <i class="fa-solid fa-calendar-check w-5"></i><span>Eventos & Convites</span>
                </button>
                <button onclick="switchTab('reuniao')" id="nav-reuniao" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-gray-400 hover:text-white hover:bg-dark-700/50 transition">
                    <i class="fa-solid fa-handshake w-5"></i><span>Reunião</span>
                </button>
                <button onclick="switchTab('passeios')" id="nav-passeios" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-gray-400 hover:text-white hover:bg-dark-700/50 transition">
                    <i class="fa-solid fa-route w-5"></i><span>Passeios & Roteiros</span>
                </button>

                <!-- Abas Restritas -->
                <button onclick="switchTab('financeiro')" id="nav-financeiro" class="nav-restrito hidden nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-gray-400 hover:text-white hover:bg-dark-700/50 transition">
                    <i class="fa-solid fa-sack-dollar w-5"></i><span>Financeiro & Rateios</span>
                </button>
                <button onclick="switchTab('aniversarios')" id="nav-aniversarios" class="nav-restrito hidden nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-gray-400 hover:text-white hover:bg-dark-700/50 transition">
                    <i class="fa-solid fa-cake-candles w-5"></i><span>Aniversários</span>
                </button>
            </nav>
        </div>

        <div class="p-4 border-t border-dark-600">
            <button onclick="resetDataConfirmation()" class="w-full text-xs text-gray-500 hover:text-red-400 py-2 transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-rotate-left"></i><span>Restaurar Dados Padrão</span>
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 h-screen overflow-y-auto bg-dark-900/40 p-4 md:p-8">

        <!-- TAB 1: DASHBOARD (RESTRITO) -->
        <section id="tab-dashboard" class="hidden">
            <h2 class="text-2xl font-heading font-black mb-4">Dashboard</h2>
            <p class="text-gray-400">Conteúdo do painel administrativo restrito.</p>
        </section>

        <!-- TAB 2: MEMBROS (INTEGRADO COM SUPABASE) -->
        <section id="tab-membros" class="block space-y-6">
            <div class="flex flex-col md:flex-row md:items-center justify-between border-b border-dark-600 pb-4 gap-4">
                <div>
                    <h2 class="text-2xl font-heading font-black text-white">Membros do Grupo</h2>
                    <p class="text-sm text-gray-400">Lista de integrantes e novos cadastros sincronizados.</p>
                </div>
                <!-- Formulário de cadastro de membro -->
                <form id="formCadastrarMembro" onsubmit="salvarMembroNoSupabase(event)" class="flex flex-col sm:flex-row gap-2 bg-dark-800 p-3 rounded-xl border border-dark-600 w-full md:w-auto">
                    <input type="text" id="membroNome" placeholder="Nome do Membro" required class="bg-dark-900 border border-dark-600 px-3 py-2 rounded-lg text-sm text-white focus:outline-none focus:border-amber-500 w-full sm:w-48">
                    <input type="text" id="membroTelefone" placeholder="Telefone / Moto" required class="bg-dark-900 border border-dark-600 px-3 py-2 rounded-lg text-sm text-white focus:outline-none focus:border-amber-500 w-full sm:w-40">
                    <button type="submit" class="bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-dark-900 font-bold px-4 py-2 rounded-lg text-sm transition shrink-0">
